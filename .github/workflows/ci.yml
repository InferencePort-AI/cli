name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check src tests packaging
      - name: Versions agree across pip, npm and cargo
        run: python packaging/check_versions.py

  launchers:
    name: Wrapper smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm launcher resolves and forwards args/exit codes
        run: |
          printf '#!/bin/sh\necho "args:$@"\nexit 7\n' > /tmp/fake-ipx && chmod +x /tmp/fake-ipx
          set +e
          out=$(IPX_BINARY_PATH=/tmp/fake-ipx node packaging/npm/ipx/bin/ipx.js a b)
          code=$?
          echo "$out"; test "$out" = "args:a b" && test "$code" = "7"
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo launcher builds with a local binary and runs it
        working-directory: packaging/cargo
        run: |
          cp /tmp/fake-ipx ./fake-ipx
          IPX_BINARY_PATH="$PWD/fake-ipx" cargo build --release
          set +e
          out=$(IPX_CACHE_DIR=/tmp/ipx-cache ./target/release/ipx x y)
          code=$?
          echo "$out"; test "$out" = "args:x y" && test "$code" = "7"
